  deployment_change_allowed: false

acceptance_criteria:
  - id: AC-01
    statement: "حداقل پنج جریان اصلی کاربری فهرست‌شده در objective، هرکدام به‌صورت گام‌به‌گام (ورودی کاربر → نتیجه سیستم) نوشته شده."
    verification: "بررسی مدیر."
  - id: AC-02
    statement: "جدول نقشه صفحات شامل نام صفحه، هدف یک‌جمله‌ای و نقش(های) مجاز دسترسی است و با TASK-0003/DRAFT_ROLES_MATRIX.md (اگر آمادهٔ بازبینی شده بود) ناسازگار نیست؛ در غیر این صورت ناسازگاری را یادداشت می‌کند، نه نادیده می‌گیرد."
    verification: "بررسی مدیر."
  - id: AC-03
    statement: "اصل «کاربر عادی با Session/Worker/Queue/UUID درگیر نمی‌شود» از PRODUCT_VISION.md در توصیف جریان‌ها رعایت شده."
    verification: "بررسی متن."
  - id: AC-04
    statement: "هرجا ترتیب یا جزئیات صفحه در OPEN_PRODUCT_QUESTIONS.md باز بود، به‌صراحت «پیشنهادی، نیازمند تأیید مالک» علامت خورده."
    verification: "تطبیق متن."

required_tests:
  - "بررسی دستی مدیر: تطبیق جریان‌ها با CAMPAIGN_LIFECYCLE.md و TEAM_INBOX.md"

required_evidence:
