objective: >
  یک فایل Markdown در پوشه همین Task ساخته شود که مهم‌ترین جریان‌های
  کاربری نسخه اول (ورود/ثبت‌نام سازمان، ساخت کمپین از فایل تا ارسال،
  Inbox و پاسخ‌گویی تیمی، اتصال حساب فرستنده، مشاهده اعتبار/کیف پول،
  داشبورد سوپرادمین) را گام‌به‌گام و به‌زبان ساده فارسی توضیح دهد و
  فهرست صفحات اصلی (نام صفحه، هدف، کاربر مجاز) را به‌صورت جدول بسازد.
  این سند فقط تحلیلی/UX است؛ هیچ طراحی گرافیکی یا کد رابط ساخته نمی‌شود.

business_reason: >
  این خروجی مورد ۵ از «مراحل لازم» در
  docs/ai/governance/AUTONOMOUS_ANALYSIS_GOAL.md و مورد «نقشه صفحات و
  جریان‌های UX» در docs/ai/CONTEXT_COVERAGE.md است.

out_of_scope:
  - "نوشتن یا تغییر هر کد در apps/**، services/**، packages/**"
  - "طراحی گرافیکی، رنگ، فونت یا فایل Figma/تصویر"
  - "تصمیم‌گیری نهایی درباره مواردی که در OPEN_PRODUCT_QUESTIONS.md «ترتیب دقیق صفحات و تأیید طرح UX» را باز گذاشته؛ این سند فقط پیشنهاد است"
  - "تغییر مستقیم docs/ai/product/** یا docs/ai/architecture/**"

