      پس از تأیید بازبین، مدیر محتوای نهایی را به‌صورت افزوده در
      docs/ai/product/BILLING_AND_CREDITS.md ادغام می‌کند؛ این فایل در
      محدوده همین Task ساخته یا تغییر داده نمی‌شود.

stop_conditions:
