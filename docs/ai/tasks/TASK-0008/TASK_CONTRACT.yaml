schema_version: 1
task_id: TASK-0008
title: "ممیزی تناقض و پوشش اسناد مادر پیش از کدنویسی"
contract_revision: 1
status: CLOSED
owner: ai_manager
implementer: chatgpt
reviewer: antigraviti-9

objective: >
  اسناد مادر فاز تحلیل را از نظر تناقض تصمیم، شکاف پوشش هدف‌های ۱ تا ۱۲،
  و آمادگی برای تصمیم مالک پیش از کدنویسی ممیزی کن. فقط یک گزارش مستند
  با شناسه یافته، شدت، محل دقیق، شاهد دوطرف و پیشنهاد اصلاح یا تصمیم لازم بساز.
  هیچ تصمیم محصولی تازه را قطعی نکن.
business_reason: >
  آیتم ۱۲ هدف مصوب در docs/ai/governance/AUTONOMOUS_ANALYSIS_GOAL.md و
  شکاف ثبت‌شده در docs/ai/CONTEXT_COVERAGE.md.
out_of_scope:
  - "کدنویسی، تست اجرایی، پایلوت، استقرار یا ارسال واقعی"
  - "اصلاح مستقیم اسناد مادر، تصمیم تجاری یا تغییر سیاست محصول"
  - "خواندن Secret، داده واقعی مشتری یا مخزن قدیمی"

must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/REVIEWER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md
  - docs/ai/governance/AUTONOMOUS_ANALYSIS_GOAL.md
  - docs/ai/CONTEXT_COVERAGE.md
  - docs/ai/DOCUMENT_MAP.yaml
  - docs/ai/OWNER_INTENT.md
  - docs/ai/product/VERSION_ONE_SCOPE.md
  - docs/ai/product/OPEN_PRODUCT_QUESTIONS.md
  - docs/ai/product/DEVELOPMENT_PHASES.md
  - docs/ai/architecture/MODULE_MAP.md
  - docs/ai/architecture/DATA_MODEL.md
  - docs/ai/product/ROLES_AND_PERMISSIONS.md
  - docs/ai/product/UX_FLOWS_AND_PAGES.md
  - docs/ai/product/CHANNEL_RESEARCH.md
  - docs/ai/product/BILLING_AND_CREDITS.md
  - docs/ai/product/SENDER_ACCOUNTS_AND_ROUTING.md
  - docs/ai/product/INTEGRATIONS_AND_CHANNELS.md

allowed_paths:
  - "docs/ai/tasks/TASK-0008/DRAFT_CONSISTENCY_AUDIT.md"
blocked_paths:
  - "apps/**"
  - "services/**"
  - "packages/**"
  - "migrations/**"
  - "infrastructure/**"
  - "docs/ai/product/**"
  - "docs/ai/architecture/**"
  - "docs/ai/governance/**"
  - "docs/ai/decisions/**"
  - ".env*"

change_budget:
  max_files_changed: 1
  max_added_dependencies: 0
  database_change_allowed: false
  public_api_change_allowed: false
  deployment_change_allowed: false

acceptance_criteria:
  - id: AC-01
    statement: "هر ۱۲ خروجی هدف مصوب با مسیر سند و وضعیت پوشش ردیابی شود."
    verification: "تطبیق جدول گزارش با AUTONOMOUS_ANALYSIS_GOAL.md و DOCUMENT_MAP.yaml."
  - id: AC-02
    statement: "تناقض‌ها و شکاف‌ها با شدت، شاهد دقیق و پیشنهاد رفع مشخص شوند."
    verification: "بازبینی دستی مستقل نمونه‌های پرخطر و همه موارد مسدودکننده."
  - id: AC-03
    statement: "تصمیم‌های باز مالک و موارد نیازمند پایلوت به‌عنوان واقعیت یا مجوز کدنویسی معرفی نشوند."
    verification: "تطبیق با OPEN_PRODUCT_QUESTIONS.md و DEVELOPMENT_PHASES.md."
  - id: AC-04
    statement: "گزارش، وضعیت آمادگی اسناد و شرط مجوز صریح مالک را با خطرهای باقی‌مانده بیان کند."
    verification: "بازبینی نتیجه و فهرست خطرها توسط مدیر و بازبین مستقل."

required_tests:
  - "بازبینی دستی تطبیقی اسناد must_read و کنترل Diff/محدوده"
required_evidence:
  - changed_files
  - diff_summary
  - test_commands_and_results
  - scope_check
  - residual_risks
  - rollback_note
documents_to_update:
  - note: "پس از بازبینی، مدیر یافته‌های تأییدشده را در اسناد مادر یا قراردادهای اصلاحی ثبت می‌کند و وضعیت آمادگی را به‌روز می‌کند."
stop_conditions:
  - "نیاز به نوشتن خارج از allowed_paths"
  - "مشاهده Secret یا داده واقعی"
  - "تناقض تصمیم مالک که بدون تصمیم تازه رفع نمی‌شود؛ همان مورد را BLOCKED_OWNER_DECISION ثبت کن و ممیزی را ادامه بده"

