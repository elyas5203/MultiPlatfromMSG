schema_version: 1
task_id: TASK-0010
title: "قراردادهای تحلیلی اتصال‌های API و سرویس‌های بیرونی"
contract_revision: 1
status: CLOSED
owner: ai_manager
implementer: antigraviti-14
reviewer: chatgpt

objective: >
  یک پیش‌نویس قرارداد تحلیلی برای چهار مسیر Public API، Webhook ورودی/خروجی،
  گفتینو و پیامک بساز. برای هر مسیر رویداد/درخواست، مرز هویت و tenant، احراز
  اصالت، یکتایی/idempotency، خطا و retry، داده حساس و موارد وابسته به انتخاب
  سرویس یا پایلوت را جدا ثبت کن؛ رفتار ناشناخته را قطعی معرفی نکن.
business_reason: "هدف ۹ تحلیل و یافته F-03 ممیزی TASK-0008 هنوز پوشش کامل ندارند."
out_of_scope:
  - "کدنویسی API، webhook واقعی، اتصال حساب، خرید سرویس، ارسال پیام یا پایلوت"
  - "انتخاب قطعی ارائه‌دهنده پیامک/روش گفتینو یا تغییر اسناد مادر"
  - "اختراع نرخ، SLA، امضای اختصاصی سرویس یا schema قطعی تأییدنشده"
must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md
  - docs/ai/governance/AUTONOMOUS_ANALYSIS_GOAL.md
  - docs/ai/tasks/TASK-0008/CONSISTENCY_AUDIT.md
  - docs/ai/product/INTEGRATIONS_AND_CHANNELS.md
  - docs/ai/product/OPEN_PRODUCT_QUESTIONS.md
  - docs/ai/architecture/MODULE_MAP.md
  - docs/ai/architecture/DATA_MODEL.md
  - docs/ai/product/BILLING_AND_CREDITS.md
allowed_paths:
  - "docs/ai/tasks/TASK-0010/DRAFT_INTEGRATION_CONTRACTS.md"
blocked_paths:
  - "apps/**"
  - "services/**"
  - "packages/**"
  - "migrations/**"
  - "infrastructure/**"
  - "docs/ai/product/**"
  - "docs/ai/architecture/**"
  - "docs/ai/governance/**"
  - ".env*"
change_budget:
  max_files_changed: 1
  max_added_dependencies: 0
  database_change_allowed: false
  public_api_change_allowed: false
  deployment_change_allowed: false
acceptance_criteria:
  - id: AC-01
    statement: "چهار مسیر خواسته‌شده جداگانه پوشش داشته باشند و هدف/مرز هرکدام مشخص باشد."
    verification: "تطبیق با هدف ۹ AUTONOMOUS_ANALYSIS_GOAL و INTEGRATIONS_AND_CHANNELS."
  - id: AC-02
    statement: "برای هر مسیر قرارداد مفهومی رویداد/داده، tenant، اصالت، یکتایی، خطا و retry ثبت شود."
    verification: "بازبینی جدول قراردادها و سناریوهای تکرار/خطا/بین‌سازمانی."
  - id: AC-03
    statement: "فرض‌ها و وابستگی‌های انتخاب سرویس یا پایلوت از قواعد مصوب جدا شوند."
    verification: "تطبیق با OPEN_PRODUCT_QUESTIONS و نبود عدد یا تضمین ساختگی."
  - id: AC-04
    statement: "هیچ کانال بیرونی حق دورزدن مرز Core، مالی، رضایت و کنترل توقف را نداشته باشد."
    verification: "تطبیق با MODULE_MAP، DATA_MODEL و ABSOLUTE_PROHIBITIONS."
required_tests:
  - "بازبینی دستی تطبیقی اسناد must_read و git diff --check و scope check"
required_evidence:
  - changed_files
  - diff_summary
  - test_commands_and_results
  - scope_check
  - residual_risks
  - rollback_note
documents_to_update:
  - "پس از رأی مستقل، مدیر قراردادهای مصوب را در سند مادر مناسب ثبت و نقشه اسناد را هماهنگ می‌کند."
stop_conditions:
  - "نیاز به تغییر خارج از allowed_paths"
  - "نیاز به انتخاب تجاری یا Secret؛ مورد را باز علامت بزن و تحلیل مستقل را ادامه بده"
  - "مشاهده Secret یا داده واقعی"
manager_approval:
  verdict: APPROVED
  approved_at: "2026-11-09"
  approval_note: "مأموریت محدود پوشش هدف ۹ و رفع F-03، بدون اتصال یا کد."
