schema_version: 1
task_id: TASK-0014
title: "فاز ۱ پ — ابزار مستقل رمزنگاری Secret با AES-256-GCM"
contract_revision: 1
status: CLOSED
owner: ai_manager
implementer: antigraviti-15
reviewer: chatgpt

objective: >
  یک ابزار کوچک و بدون ذخیره‌سازی برای رمزگذاری و بازیابی Secret با AES-256-GCM
  در apps/core بساز که کلید ۳۲ بایتی را از فراخواننده بگیرد، برای هر رمزگذاری
  nonce تصادفی بسازد و شناسه سازمان و کاربرد Secret را به داده احراز اصالت ببندد.
business_reason: >
  فاز ۱ در DEVELOPMENT_PHASES.md ابزار رمزنگاری Secret را لازم می‌داند؛ این
  برش مستقل از تصمیم باز مالک درباره OTP یا گذرواژه است.
out_of_scope:
  - "ذخیره‌سازی، چرخش، تولید یا توزیع کلید در محیط واقعی"
  - "اتصال به دیتابیس، فرستنده، حساب، Endpoint، احراز هویت یا RBAC"
  - "Secret واقعی، credential واقعی، داده مشتری یا لاگ مقدار محرمانه"
  - "تغییر schema، migration، API عمومی یا استقرار"
