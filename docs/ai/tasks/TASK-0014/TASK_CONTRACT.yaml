stop_conditions:
  - "نیاز به Secret یا کلید واقعی، تغییر schema، dependency یا فایل خارج از allowed_paths"
  - "ابهام در قرارداد داده یا رفتار رمزنگاری که در محدوده کوچک حل نشود"
  - "ناتوانی در اجرای تست اجباری یا مشاهده داده محرمانه"
  - "نیاز به تصمیم روش ورود، اعمال RBAC یا اتصال به حساب واقعی"
