acceptance_criteria:
  - id: AC-01
    statement: "رمزگذاری و بازیابی با کلید ۳۲ بایتی معتبر درست است؛ دو بار رمزگذاری یک متن، خروجی متفاوت دارد. قالب خروجی نسخه‌دار است."
    verification: "تست round-trip، تفاوت nonce/output و تشخیص نسخه قالب."
  - id: AC-02
    statement: "بازیابی با tenant_id، کاربرد Secret یا کلید متفاوت رد می‌شود. tenant_id و کاربرد خالی یا نامعتبر پذیرفته نمی‌شوند."
    verification: "تست جداسازی سازمان و کاربرد و اعتبارسنجی ورودی."
  - id: AC-03
    statement: "دستکاری ciphertext، nonce یا authentication tag و قالب خراب رد می‌شود؛ خطا و خروجی هیچ Secret، کلید یا متن اصلی را افشا نمی‌کند."
    verification: "تست tampering و بازرسی کد برای نبود چاپ داده حساس."
  - id: AC-04
    statement: "هیچ dependency، schema، endpoint یا مسیر خارج از قرارداد تغییر نمی‌کند؛ تست تازه در دستور npm test قرار می‌گیرد."
    verification: "git diff --check، کنترل فایل‌ها، npm ci، npm run build و npm test با کد خروج واقعی."
required_tests:
  - "آزمون واحد تمام حالت‌های AC-01 تا AC-03 با داده و کلید ساختگی"
  - "npm ci و npm run build در apps/core"
  - "npm test کامل، شامل آزمون‌های PostgreSQL موجود، روی نمونه تست مستقل مجری با نشانگر ایمنی و exit code صفر"
  - "git diff --check و کنترل allowed_paths/blocked_paths"
required_evidence:
  - changed_files
  - diff_summary
  - test_commands_and_results
  - scope_check
  - residual_risks
  - rollback_note
documents_to_update:
