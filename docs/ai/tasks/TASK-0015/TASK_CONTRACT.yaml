acceptance_criteria:
  - id: AC-01
    statement: "migration جدید نام کاربری (یکتا در هر tenant)، hash رمز و جدول نشست با tenant_id و کلید خارجی مرکب را اضافه می‌کند؛ رمز خام هیچ‌جا ذخیره نمی‌شود. hash با argon2id (یا bcrypt با دلیل مستند)."
    verification: "migrate deploy روی PostgreSQL تازه و آزمون یکپارچه."
  - id: AC-02
    statement: "POST ورود با شناسه سازمان، نام کاربری و رمز درست نشست می‌سازد؛ رمز/کاربر/سازمان نادرست و کاربر غیرفعال با پیام یکسان و بدون افشای وجود کاربر رد می‌شود. توکن نشست تصادفی ≥۲۵۶ بیت است و فقط hash آن در پایگاه ذخیره می‌شود؛ نشست انقضا و ابطال (خروج) دارد."
    verification: "آزمون یکپارچه HTTP روی PostgreSQL."
  - id: AC-03
    statement: "تغییر رمز نیازمند نشست معتبر و رمز فعلی است و بقیه نشست‌های همان کاربر را باطل می‌کند. بازنشانی رمز فقط توسط نقش مدیر همان سازمان (یا SA طبق ROLES_AND_PERMISSIONS) ممکن است و بین سازمان‌ها رد می‌شود؛ پس از بازنشانی همه نشست‌های کاربر باطل می‌شوند."
    verification: "آزمون‌های مثبت و منفی، شامل تلاش میان‌سازمانی."
  - id: AC-04
    statement: "محدودیت تلاش ناموفق ورود (قفل موقت قابل‌تنظیم از env، بدون عدد ثابت پراکنده در کد) وجود دارد؛ حداقل طول رمز اعمال می‌شود؛ هیچ رمز، hash یا توکن در لاگ/خطا نمی‌آید."
    verification: "آزمون و بازرسی کد."
  - id: AC-05
    statement: "npm test همه فایل‌های dist/test/**/*.test.js را خودکار اجرا می‌کند (بدون فهرست دستی فایل‌ها) تا Taskهای موازی بدون تغییر package.json آزمون اضافه کنند؛ همه آزمون‌های قبلی (۳۶) همچنان قبول‌اند."
    verification: "npm test با exit 0 و شمارش آزمون‌ها."
