objective: >
  احراز هویت کارکنان با نام کاربری و رمز عبور ثابت طبق DEC-0003 در apps/core:
  ذخیره hash رمز، ورود، نشست قابل ابطال، خروج، تغییر رمز توسط خود کاربر و
  بازنشانی رمز کارکنان توسط مدیر همان سازمان. این Task مالک خط schema است.
business_reason: "DEC-0003 روش ورود را قطعی کرد؛ RBAC و همه فازهای بعد به هویت کاربر وابسته‌اند."
out_of_scope:
