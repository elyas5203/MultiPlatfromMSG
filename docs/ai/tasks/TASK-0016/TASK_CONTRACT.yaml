acceptance_criteria:
  - id: AC-01
    statement: "حلقه کلید از یک ورودی پیکربندی (رشته env با چند کلید ۳۲ بایتی base64 و شناسه هرکدام، به‌علاوه شناسه کلید فعال) ساخته می‌شود؛ پیکربندی خالی، کلید با طول نادرست، شناسه تکراری یا کلید فعال ناشناخته با خطای عمومی و بدون افشای مقدار رد می‌شود (fail closed)."
    verification: "آزمون واحد."
  - id: AC-02
    statement: "خروجی رمزشده شناسه کلید را در قالب نسخه‌دار حمل می‌کند و شناسه کلید در AAD بسته است؛ بازیابی با کلید درست از حلقه انجام می‌شود و شناسه ناشناخته یا دستکاری‌شده رد می‌شود. خروجی‌های قالب TASK-0014 یا همچنان خوانده می‌شوند یا ناسازگاری صریحاً آزموده و در گزارش ثبت می‌شود."
    verification: "آزمون واحد round-trip، tampering و سازگاری."
  - id: AC-03
    statement: "تابع بازرمزگذاری، مقدار رمزشده با کلید قدیمی را با کلید فعال دوباره رمز می‌کند و جداسازی tenant/purpose حفظ می‌شود؛ پس از حذف کلید قدیمی از حلقه، مقدار قدیمی دیگر باز نمی‌شود."
    verification: "آزمون واحد چرخش."
  - id: AC-04
    statement: "شش آزمون secret-crypto موجود بدون تغییر رفتار قبول می‌مانند؛ هیچ کلید یا Secret در خطا/لاگ نیست."
    verification: "npm ci، npm run build، node --test dist/test/key-ring.test.js dist/test/secret-crypto.test.js و npm test کامل."
