acceptance_criteria:
  - id: AC-01
    statement: "تجزیه‌گر CSV مطابق RFC 4180: نقل‌قول، ویرگول و خط جدید داخل نقل‌قول، CRLF/LF، BOM UTF-8، جداکننده ویرگول یا نقطه‌ویرگول، سطر خالی. پردازش به‌صورت جریانی/تکه‌ای است و فایل ۱۰۰٬۰۰۰ ردیفی بدون بارگذاری همه ردیف‌های خام در یک آرایه اضافه پردازش می‌شود."
    verification: "آزمون واحد و آزمون ۱۰۰٬۰۰۰ ردیف ساختگی."
  - id: AC-02
    statement: "ستون شماره با سرستون فارسی یا انگلیسی رایج (مثلاً شماره، موبایل، تلفن، phone، mobile) یا در نبود سرستون با ستون اول تشخیص داده می‌شود؛ ستون‌های نام اختیاری حفظ می‌شوند. فایل ساده تک‌ستونه فقط شماره پذیرفته می‌شود."
    verification: "آزمون واحد."
  - id: AC-03
    statement: "نرمال‌سازی شماره موبایل ایران به قالب واحد +989XXXXXXXXX از ورودی‌های 09…، 9…، 989…، +989…، 00989…، با ارقام فارسی/عربی، فاصله، خط تیره و پرانتز. ورودی نامعتبر با کد دلیل مشخص رد می‌شود و حدس زده نمی‌شود."
    verification: "آزمون جدولی مثبت و منفی."
  - id: AC-04
    statement: "حذف تکراری بر اساس شماره نرمال‌شده (اولین ردیف می‌ماند). خروجی شامل ردیف‌های معتبر، فهرست ردیف‌های ردشده با شماره ردیف و کد دلیل، و خلاصه شمارش (کل، معتبر، تکراری، نامعتبر) است. سقف تعداد ردیف پارامتر ورودی است، نه عدد ثابت در کد."
    verification: "آزمون واحد."
  - id: AC-05
    statement: "هیچ شماره کامل در پیام خطا یا لاگ نمی‌آید (حداکثر ماسک‌شده)؛ داده آزمون کاملاً ساختگی است."
    verification: "بازرسی کد و آزمون."
