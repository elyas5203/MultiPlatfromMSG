objective: >
  یک کتابخانه خالص (بدون پایگاه داده، بدون Endpoint، بدون dependency جدید) در
  apps/core که محتوای CSV مخاطبان را می‌خواند، شماره‌ها را نرمال و اعتبارسنجی
  می‌کند، تکراری‌ها را حذف می‌کند و گزارش ردیف‌به‌ردیف خطا می‌دهد. XLSX و
  ذخیره در پایگاه در Taskهای بعدی می‌آیند.
business_reason: "شروع ایزوله فاز ۲ بدون وابستگی به schema تا هم‌زمان با احراز هویت جلو برود."
