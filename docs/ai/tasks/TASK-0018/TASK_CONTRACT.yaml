objective: >
  پیاده‌سازی ماژول کانتکست چندسازمانی مبتنی بر AsyncLocalStorage و NestJS Middleware / Interceptor
  در apps/core/src/tenant جهت استخراج امن tenant_id، ذخیره در کانتکست غیرهمگام درخواست،
  تزریق خودکار و مسدودسازی قطعی هر درخواست فاقد tenant_id (به جز اندپوینت‌های صریحاً عمومی مانند لاگین).
business_reason: "تضمین معماری چندسازمانی در لایه وب و ممانعت ساختاری از اجرای عملیات بدون کانتکست سازمان."
out_of_scope:
  - "تغییرات دیتابیس یا schema.prisma"
  - "تغییرات auth یا rbac (تنها تعامل با هدر/توکن جهت خواندن tenant_id)"
  - "تغییر package.json"
must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md
  - docs/ai/decisions/DEC-0003-password-login-and-wave-authority.md
  - docs/ai/product/DEVELOPMENT_PHASES.md
allowed_paths:
  - "apps/core/src/tenant/**"
  - "apps/core/test/tenant-context.test.ts"
blocked_paths:
  - "docs/ai/**"
  - "apps/core/prisma/**"
  - "apps/core/src/auth/**"
  - "apps/core/src/security/**"
  - "apps/core/src/contacts-import/**"
  - "apps/core/src/contacts/**"
  - "apps/core/src/billing/**"
  - "apps/core/package.json"
  - "apps/core/package-lock.json"
  - "**/.env"
change_budget:
  max_files_changed: 6
  max_added_dependencies: 0
  database_change_allowed: false
  public_api_change_allowed: false
  deployment_change_allowed: false
acceptance_criteria:
  - id: AC-01
    statement: "پیاده‌سازی کلاس TenantContext با استفاده از AsyncLocalStorage استاندارد نودجی‌اس که امکان اجرا در محدوده کانتکست یک درخواست (runWithTenant) و بازیابی getTenantId() را فراهم می‌کند؛ در صورت فراخوانی خارج از کانتکست، با خطای صریح Fail-Closed مواجه شود."
    verification: "آزمون واحد کانتکست غیرهمگام با تست همزمانی."
  - id: AC-02
    statement: "میان‌افزار یا رهگیر استخراج tenant_id از هدر استاندارد 'x-tenant-id' یا کانتکست احراز هویت؛ اعتبارسنجی فرمت معتبر شناسه سازمان و جلوگیری از تزریق مقادیر خالی، نامعتبر یا کاراکترهای مخرب."
    verification: "آزمون‌های مثبت و منفی ورودی هدر."
  - id: AC-03
    statement: "مسدودسازی قطعی دسترسی به روت‌های محافظت‌شده در صورت غیاب tenant_id با خطای استاندارد 400 یا 401، بدون نشت اطلاعات سیستم."
    verification: "آزمون‌های یکپارچه‌ساز HTTP."
required_tests:
  - "npm run build"
  - "node --test dist/test/tenant-context.test.js با exit 0"
  - "git diff --check و کنترل محدوده فایل‌ها"
required_evidence:
  - changed_files
  - diff_summary
  - test_commands_and_results
  - scope_check
  - residual_risks
  - rollback_note
documents_to_update:
  - "پس از تحویل، مدیر وضعیت را ثبت می‌کند."
stop_conditions:
  - "نیاز به تغییر schema یا فایل‌های خارج از allowed_paths"
  - "ناتوانی در اجرای آزمون‌ها"
manager_approval:
