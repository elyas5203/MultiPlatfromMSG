    verification: "تطبیق تایپ و آزمون واحد."
  - id: AC-02
    statement: "پیاده‌سازی دکوراتور @Roles(...) و گارد RolesGuard در NestJS؛ در صورت نبود کاربر در کانتکست یا عدم تطابق نقش با نیاز متد/کنترلر، درخواست با خطای ۴۰۳ (Forbidden) متوقف شود؛ متدهای عمومی (@Public) بدون نقش اجازه عبور یابند."
    verification: "آزمون‌های یکپارچه‌ساز NestJS ExecutionContext."
  - id: AC-03
    statement: "بررسی سلسله‌مراتب یا تفکیک نقش‌ها: اطمینان از عدم دسترسی STF به عملیات مدیریتی OMGR، و عدم دسترسی OMGR به عملیات انحصاری SA."
    verification: "آزمون‌های جدولی مثبت و منفی برای کلیه ترکیب‌های نقش."
