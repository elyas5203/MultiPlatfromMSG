schema_version: 1
task_id: TASK-0020
title: "فاز ۲ ب — مدل داده و مایگریشن مخاطبان، برچسب‌ها و فهرست انصراف در PostgreSQL"
contract_revision: 1
status: APPROVED_FOR_IMPLEMENTATION
owner: ai_manager
implementer: antigraviti-elyas
reviewer: chatgpt
branch: task/TASK-0020-contacts-schema
base_commit: main
worktree: E:/projects/MultiPlatformMsg-agents/elyas-task-0020

objective: >
  تعریف مدل‌های داده مخاطبان (Contact)، برچسب‌ها (Tag)، اتصال برچسب به مخاطب (ContactTag)،
  و فهرست انصراف/بلک‌لیست (SuppressionEntry) در schema.prisma، تولید مایگریشن رسمی PostgreSQL،
  اعمال قیدهای یکتایی مرکب [tenant_id, phone_normalized] و کلیدهای خارجی،
  و پیاده‌سازی ContactsRepository با تفکیک اجباری tenant_id در apps/core/src/contacts.
business_reason: "ذخیره‌سازی و پایداری اطلاعات مخاطبان و رعایت الزامات حاکمیتی بلک‌لیست انصراف طبق فاز ۲."
out_of_scope:
  - "بارگذاری فایل یا اتصال به ماژول CSV (در تسک بعدی تجمیع می‌شود)"
  - "تغییر ماژول‌های auth, security, tenant, rbac"
  - "ارسال پیام یا کمپین"
must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md
  - docs/ai/architecture/DATA_MODEL.md
  - docs/ai/product/DEVELOPMENT_PHASES.md
  - docs/ai/decisions/DEC-0003-password-login-and-wave-authority.md
allowed_paths:
  - "apps/core/prisma/**"
  - "apps/core/src/contacts/**"
  - "apps/core/test/contacts-db.test.ts"
blocked_paths:
  - "docs/ai/**"
  - "apps/core/src/auth/**"
  - "apps/core/src/tenant/**"
  - "apps/core/src/security/**"
  - "apps/core/src/contacts-import/**"
  - "apps/core/src/rbac/**"
  - "apps/core/src/billing/**"
  - "apps/core/package.json"
  - "apps/core/package-lock.json"
  - "**/.env"
change_budget:
  max_files_changed: 10
  max_added_dependencies: 0
  database_change_allowed: true
  public_api_change_allowed: false
  deployment_change_allowed: false
acceptance_criteria:
  - id: AC-01
    statement: "افزودن مدل‌های Contact, Tag, ContactTag, SuppressionEntry به schema.prisma با ستون اجباری tenant_id در تمام جداول و کلیدهای خارجی مناسب."
    verification: "بررسی schema و مایگریشن SQL."
  - id: AC-02
    statement: "قید یکتایی مرکب @@unique([tenantId, phoneNormalized]) روی Contact تا هیچ مخاطب تکراری در یک سازمان ذخیره نشود؛ قید یکتایی مرکب @@unique([tenantId, phoneNormalized]) روی SuppressionEntry."
    verification: "آزمون یکپارچه نقض یکتایی دیتابیس."
  - id: AC-03
    statement: "پیاده‌سازی ContactsRepository جهت ثبت مخاطب، جستجو با شماره، افزودن برچسب و ثبت انصراف (Suppression) با فیلتر اجباری tenantId در کلیه کوئری‌ها و رد عملیات فاقد tenantId."
    verification: "آزمون‌های جداسازی چندسازمانی در contacts-db.test.ts روی دیتابیس آزمایشی."
required_tests:
  - "npx prisma migrate deploy روی PostgreSQL آزمایشی تازه"
  - "npm run build"
  - "node --test dist/test/contacts-db.test.js با exit 0"
  - "git diff --check و کنترل مسیرها"
required_evidence:
  - changed_files
  - diff_summary
  - test_commands_and_results
  - scope_check
  - residual_risks
  - rollback_note
documents_to_update:
