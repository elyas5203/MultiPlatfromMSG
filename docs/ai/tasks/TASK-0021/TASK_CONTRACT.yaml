change_budget:
  max_files_changed: 6
  max_added_dependencies: 0
  database_change_allowed: false
  public_api_change_allowed: false
  deployment_change_allowed: false
acceptance_criteria:
  - id: AC-01
    statement: "تعریف تایپ‌ها و ساختار رکوردهای دفترکل: LedgerEntry فقط‌افزودنی (Append-only) با فیلدهای tenantId, accountId, sequence, entryType (DEBIT, CREDIT), amount (BigInt/integer مثبت), purpose, referenceId و timestamp."
    verification: "آزمون واحد تایپ و اعتبارسنجی ورودی."
  - id: AC-02
    statement: "موتور محاسبه مانده حساب (LedgerCalculator): محاسبه مانده خالص از جمع جبری تراکنش‌های دفترکل؛ ممنوعیت صریح هرگونه فیلد مانده قابل‌ویرایش دستی."
    verification: "آزمون واحد محاسبه مانده با صدها تراکنش تصادفی."
  - id: AC-03
    statement: "فرآیند دورمرحله‌ای رزرو اعتبار (Credit Reservation): امکان رزرو موقت اعتبار برای کمپین؛ جلوگیری قطعی از رزرو در صورت کسری موجودی نسبت به سقف اعتبار مجاز؛ تسویه (Settle) قطعی بر مبنای مصرف واقعی و آزادسازی فوری (Release) باقیمانده بدون نشت اعتبار."
    verification: "آزمون‌های سناریوی کامل رزرو، لغو جزئی و آزادسازی."
  - id: AC-04
    statement: "پایبندی به دقت محاسباتی کامل: تمامی محاسبات بر مبنای کوچک‌ترین واحد پولی (مثلاً ریال یا واحد صحیح) با BigInt یا integer بدون خطای تقریب ممیز شناور (No floating-point math leak)."
    verification: "آزمون واحد دقت ریاضی."
required_tests:
