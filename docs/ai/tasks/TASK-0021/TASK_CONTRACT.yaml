objective: >
  پیاده‌سازی کتابخانه خالص و موتور محاسباتی تراکنش‌های دفترکل مالی (Double-Entry Immutable Ledger Engine)
  در apps/core/src/billing شامل ثبت رویدادهای مالی تغییرناپذیر (Append-Only)، محاسبه اتمیک مانده،
  فرآیند دورمرحله‌ای رزرو اعتبار کمپین (Reservation, Settle, Release)،
  و جلوگیری ساختاری و ریاضی از مانده منفی بدون سقف مجاز، با استفاده از اعداد صحیح/BigInt (بدون ممیز شناور).
business_reason: "تضمین انطباق با نبایدهای مطلق مالی (قاعده ۲ نقشه ماژول‌ها) و آماده‌سازی فاز ۳ به‌صورت مستقل."
out_of_scope:
  - "تغییرات دیتابیس یا schema.prisma (در فاز بعدی با تسک دیتابیس انجام می‌شود)"
  - "درگاه پرداخت آنلاین واقعی یا ارز خارجی"
  - "تغییر package.json یا افزودن وابستگی"
must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md
  - docs/ai/architecture/MODULE_MAP.md
  - docs/ai/product/BILLING_EVENTS_AND_LEDGER.md
  - docs/ai/product/DEVELOPMENT_PHASES.md
  - docs/ai/decisions/DEC-0003-password-login-and-wave-authority.md
allowed_paths:
  - "apps/core/src/billing/**"
  - "apps/core/test/billing-ledger.test.ts"
blocked_paths:
  - "docs/ai/**"
  - "apps/core/prisma/**"
  - "apps/core/src/auth/**"
  - "apps/core/src/tenant/**"
  - "apps/core/src/security/**"
  - "apps/core/src/contacts/**"
  - "apps/core/src/contacts-import/**"
  - "apps/core/src/rbac/**"
  - "apps/core/package.json"
  - "apps/core/package-lock.json"
