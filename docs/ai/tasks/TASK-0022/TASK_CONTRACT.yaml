objective: >
  پیاده‌سازی کنترلر، ماژول و سرویس NestJS برای مدیریت مخاطبان، برچسب‌ها و فهرست انصراف در apps/core/src/contacts
  با اتصال به ContactsRepository، اعمال TenantGuard و RolesGuard، اعتبارسنجی ورودی‌ها (DTO)
  و تفکیک سطوح دسترسی مطابق ماتریس RBAC.
business_reason: "ارائه API استاندارد وب برای مدیریت لیست‌های مخاطبان، برچسب‌گذاری و استعلام انصراف با امنیت کامل چندسازمانی."
out_of_scope:
  - "تغییر ساختار دیتابیس یا مایگریشن جدید"
  - "پردازش جریانی فایل CSV (در تسک‌های دیگر انجام شده)"
  - "تغییر package.json"
must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md
  - docs/ai/product/ROLES_AND_PERMISSIONS.md
allowed_paths:
  - "apps/core/src/contacts/contacts.controller.ts"
  - "apps/core/src/contacts/contacts.service.ts"
  - "apps/core/src/contacts/contacts.module.ts"
  - "apps/core/src/contacts/dto/**"
  - "apps/core/src/contacts/index.ts"
  - "apps/core/src/app.module.ts"
  - "apps/core/test/contacts-api.test.ts"
blocked_paths:
  - "docs/ai/**"
  - "apps/core/prisma/**"
  - "apps/core/src/auth/**"
  - "apps/core/src/billing/**"
  - "apps/core/package.json"
  - "apps/core/package-lock.json"
  - "**/.env"
change_budget:
  max_files_changed: 8
  max_added_dependencies: 0
  database_change_allowed: false
  public_api_change_allowed: true
  deployment_change_allowed: false
acceptance_criteria:
  - id: AC-01
    statement: "پیاده‌سازی ContactsController با متدهای CRUD مخاطبان (ثبت، مشاهده، ویرایش، حذف)، مدیریت برچسب‌ها، انتساب برچسب به مخاطب، و ثبت/حذف انصراف؛ تزریق خودکار tenantId از TenantContext."
    verification: "آزمون‌های یکپارچه‌ساز کنترلر با HTTP status های صحیح."
  - id: AC-02
    statement: "اعمال گارد‌های TenantGuard و RolesGuard؛ دسترسی‌های ویرایشی منحصر به نقش‌های OMGR و OP؛ دسترسی‌های خواندنی برای OMGR, OP, STF, AUD؛ مسدودسازی قطعی درخواست بدون سازمان با ۴۰۰ و نقش غیرمجاز با ۴۰۳."
    verification: "آزمون ماتریسی کدهای ۴۰۳، ۴۰۰ و ۲۰۰."
  - id: AC-03
    statement: "اعتبارسنجی ورودی‌ها: نرمال‌سازی شماره تلفن، جلوگیری از تزریق فیلدهای ناشناس، و رعایت پاسخ‌های استاندارد JSON."
    verification: "آزمون‌های DTO و اعتبارسنجی ورودی."
required_tests:
  - "npm run build"
  - "node --test dist/test/contacts-api.test.js با exit 0"
  - "git diff --check و کنترل محدوده فایل‌ها"
required_evidence:
  - changed_files
  - diff_summary
  - test_commands_and_results
  - scope_check
  - residual_risks
  - rollback_note
documents_to_update:
  - "پس از تحویل، مدیر وضعیت را ثبت می‌کند."
stop_conditions:
  - "نیاز به تغییر schema یا فایل‌های خارج از allowed_paths"
  - "ناتوانی در اجرای آزمون‌ها"
manager_approval:
  verdict: APPROVED
