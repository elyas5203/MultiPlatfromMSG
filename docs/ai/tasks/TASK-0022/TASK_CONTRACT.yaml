title: "فاز ۲ ج — کنترلر و اندپوینت‌های مدیریت مخاطبان و برچسب‌ها با تزریق کانتکست و RBAC"
contract_revision: 1
status: APPROVED_FOR_IMPLEMENTATION
owner: ai_manager
