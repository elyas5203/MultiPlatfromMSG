schema_version: 1
task_id: TASK-0023
title: "فاز ۱ د — سیاست‌های امنیت سطح سطر PostgreSQL (Row-Level Security - RLS)"
contract_revision: 1
status: APPROVED_FOR_IMPLEMENTATION
owner: ai_manager
implementer: antigraviti-15
reviewer: chatgpt
branch: task/TASK-0023-postgres-rls
base_commit: main
worktree: E:/projects/MultiPlatformMsg-agents/antigravity-15-task-0023

objective: >
  پیاده‌سازی مایگریشن رسمی فعال‌سازی Row-Level Security (RLS) روی تمام جداول حاوی tenant_id در PostgreSQL،
  اعمال ENABLE ROW LEVEL SECURITY و FORCE ROW LEVEL SECURITY با شرط
  current_setting('app.current_tenant_id', true) = tenant_id، به همراه هلپر و سرویس RlsSessionService
  جهت تنظیم امن نشست پایگاه داده با SET LOCAL app.current_tenant_id.
business_reason: "دفاع در عمق (Defense-in-Depth) و تضمین قطعی عدم نشت داده حتی در صورت وجود نقص در لایه کدهای اپلیکیشن."
out_of_scope:
  - "تغییر کدهای Auth یا فرانت‌اند"
  - "تغییر لاجیک تجاری مخاطبان یا صورتحساب"
  - "تغییر package.json"
must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md
allowed_paths:
  - "apps/core/prisma/migrations/20261110180000_enable_postgres_rls/**"
  - "apps/core/src/tenant/rls.service.ts"
  - "apps/core/src/tenant/index.ts"
  - "apps/core/test/rls-db.test.ts"
blocked_paths:
  - "docs/ai/**"
  - "apps/core/src/auth/**"
  - "apps/core/src/billing/**"
  - "apps/core/package.json"
  - "apps/core/package-lock.json"
  - "**/.env"
change_budget:
  max_files_changed: 5
  max_added_dependencies: 0
  database_change_allowed: true
  public_api_change_allowed: false
  deployment_change_allowed: false
acceptance_criteria:
  - id: AC-01
    statement: "مایگریشن رسمی PostgreSQL برای فعال‌سازی RLS و FORCE RLS روی جداول: brands, staff, teams, sessions, contacts, tags, contact_tags, suppression_entries با سیاست تفکیک tenant_id."
    verification: "بررسی DDL و اجرای migrate deploy روی دیتابیس تمیز با توکن نشانگر ایمنی."
  - id: AC-02
    statement: "پیاده‌سازی سرویس RlsSessionService یا متد کمکی برای اجرای امن SET LOCAL app.current_tenant_id در محدوده ترنزکشن دیتابیس."
    verification: "آزمون واحد ترنزکشن و کانتکست سشن."
  - id: AC-03
    statement: "آزمون‌های یکپارچه‌ساز دیتابیس: اثبات اینکه در صورت عدم تنظیم app.current_tenant_id هیچ سطری خوانده یا نوشته نمی‌شود (Fail-Closed)، و پس از ست شدن سشن تنها سطرهای همان سازمان قابل دیدن هستند."
    verification: "تست‌های زنده دوطرفه با دو Tenant مجزا."
required_tests:
  - "npm run build"
  - "node --test dist/test/rls-db.test.js با exit 0"
  - "git diff --check و کنترل محدوده فایل‌ها"
