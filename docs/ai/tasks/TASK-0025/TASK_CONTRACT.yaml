objective: >
  اتصال ماژول جریانی ContactsImporter (از TASK-0017) به ContactsRepository (از TASK-0020)
  در قالبی یکپارچه تحت عنوان ContactsCsvPipelineService در apps/core/src/contacts-import
  جهت واردسازی گروهی (بسته‌های قابل تنظیم ۱۰۰۰ تایی)، بررسی بلادرنگ فهرست انصراف (Suppression)،
  انتساب برچسب پیش‌فرض سازمان، و بازگرداندن گزارش آماری دقیق و تمیز.
business_reason: "امکان پردازش و ذخیره امن فایل‌های مخاطبان با کارایی بالا و رعایت لیست سیاه بدون فشار حافظه."
out_of_scope:
