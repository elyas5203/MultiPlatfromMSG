acceptance_criteria:
  - id: AC-01
    statement: "پیاده‌سازی متد importStreamIntoRepository با پشتیبانی از استریم خواندنی CSV، تزریق اجباری tenant_id، دسته‌بندی عملیات درج در دسته‌های بچینگ (Batch Size)، و جلوگیری از تداخل حافظه‌ای."
    verification: "آزمون واحد جریانی و اعتبارسنجی کارایی."
  - id: AC-02
    statement: "پشتیبانی از فهرست انصراف: شناسایی شماره‌های موجود در suppression_entries و علامت‌گذاری آن‌ها در گزارش یا نادیده‌گرفتن درج مطابق سیاست پیکربندی‌شده."
    verification: "آزمون سناریو با لیست انصراف موجود."
  - id: AC-03
    statement: "بازگرداندن گزارش ساختاریافته شامل: totalRows, processedRows, importedCount, duplicateSkippedCount, suppressedCount, invalidCount, errors بدون افشای شماره‌های کامل در لاگ."
    verification: "آزمون گزارش‌گیری و بررسی خروجی."
required_tests:
  - "npm run build"
  - "node --test dist/test/contacts-csv-pipeline.test.js با exit 0"
  - "git diff --check و کنترل محدوده فایل‌ها"
required_evidence:
