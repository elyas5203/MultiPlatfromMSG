    verification: "آزمون پذیرش پیام جدید."
  - id: AC-03
    statement: "اثبات رفتار ۲ و ۳ (تکلیف کارهای جاری و تعلیق مصرف صفوف): عدم دیسپچ پیام‌های معلق و جلوگیری از ارسال مضاعف بدون حذف فیزیکی پیام‌ها از صف."
    verification: "آزمون شبیه‌سازی صف و مصرف‌کننده."
