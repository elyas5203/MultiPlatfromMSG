objective: >
  پیاده‌سازی هسته توقف اضطراری (KillSwitchService) در apps/core/src/messaging
  شامل ۳ رفتار ایمن: ۱) توقف پذیرش جدید (New Admissions)، ۲) مدیریت کارهای در حال پردازش (In-Flight Tasks)،
  ۳) تعلیق مصرف صفوف (Pending Queues)، به همراه قرارداد و تعاریف رویدادهای صف پیام در RabbitMQ.
business_reason: "تضمین توقف فوری و بدون بازگشت هرگونه ارسال پیام در شرایط اضطراری قبل از فعال‌سازی کانکتورها در فاز ۵."
