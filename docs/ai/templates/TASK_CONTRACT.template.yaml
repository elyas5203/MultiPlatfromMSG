schema_version: 1
task_id: TASK-XXXX
title: "یک نتیجه کوچک و قابل آزمون"
contract_revision: 1
status: DRAFT
owner: ai_manager
implementer: unassigned
reviewer: unassigned

objective: "پس از پایان، چه نتیجه قابل مشاهده‌ای ایجاد می‌شود؟"
business_reason: "چرا این کار لازم است؟"
out_of_scope:
  - "هر چیزی که آگاهانه در این مأموریت انجام نمی‌شود"

must_read:
  - docs/ai/START_HERE.md
  - docs/ai/CURRENT_STATE.md
  - docs/ai/governance/CODER_PROTOCOL.md
  - docs/ai/governance/ABSOLUTE_PROHIBITIONS.md

allowed_paths:
  - "مسیر دقیق فایل یا پوشه مجاز"
blocked_paths:
  - docs/ai/product/**
  - docs/ai/architecture/**
  - docs/ai/governance/**
  - .env*

change_budget:
  max_files_changed: 1
  max_added_dependencies: 0
  database_change_allowed: false
  public_api_change_allowed: false
  deployment_change_allowed: false

acceptance_criteria:
  - id: AC-01
    statement: "رفتار قابل مشاهده و بدون ابهام"
    verification: "تست یا بررسی مشخص"

required_tests:
  - "نام و سطح تست اجباری"
required_evidence:
  - changed_files
  - diff_summary
  - test_commands_and_results
  - scope_check
  - residual_risks
  - rollback_note

documents_to_update: []
stop_conditions:
  - "نیاز به فایل خارج از allowed_paths"
  - "ابهام در تصمیم محصول"
  - "مشاهده Secret یا داده واقعی در خروجی"
  - "ناتوانی در اجرای تست اجباری"

manager_approval:
  verdict: PENDING
  approved_at: null
  approval_note: null
